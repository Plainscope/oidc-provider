services:
  # WARNING: default secret values below are DEVELOPMENT-ONLY and committed for local e2e convenience.
  # Never use them in production. Override via DIRECTORY_BEARER_TOKEN / PROVIDER_CLIENT_ID /
  # PROVIDER_CLIENT_SECRET environment variables (see CI workflow and production compose file).
  directory:
    build:
      context: ./src/directory
      dockerfile: Dockerfile
    container_name: oidc-directory
    restart: unless-stopped
    environment:
      PORT: 8080
      USERS_FILE: /app/config/users.json
      DATABASE_FILE: /data/directory.db
      BEARER_TOKEN: ${DIRECTORY_BEARER_TOKEN:-local-dev-bearer-token}
      SESSION_COOKIE_SECURE: false
    volumes:
      - ${DIRECTORY_USERS_FILE:-./docker/provider/users.json}:/app/config/users.json:ro
      - directory-data:/data:rw
    ports:
      - "${DIRECTORY_PORT:-7080}:8080"
    networks:
      - oidc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  provider:
    build:
      context: ./src/provider
      dockerfile: Dockerfile
    container_name: oidc-provider
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      ISSUER: http://provider:8080
      CLIENT_ID: ${PROVIDER_CLIENT_ID:-test-client-id}
      CLIENT_SECRET: ${PROVIDER_CLIENT_SECRET:-local-dev-secret}
      REDIRECT_URIS: http://localhost:${DEMO_PORT:-8080}/signin-oidc
      POST_LOGOUT_REDIRECT_URIS: http://localhost:${DEMO_PORT:-8080}/signout-callback-oidc
      DIRECTORY_TYPE: ${DIRECTORY_TYPE:-sqlite}
      DIRECTORY_DATABASE_FILE: /data/directory.db
      DIRECTORY_USERS_FILE: /app/config/users.json
      DIRECTORY_BASE_URL: ${DIRECTORY_BASE_URL:-http://directory:8080}
      DIRECTORY_HEADERS: ${DIRECTORY_HEADERS:-{"Authorization":"Bearer local-dev-bearer-token"}}
      FEATURES_DEV_INTERACTIONS: false
      DATABASE_FILE: /data/oidc.db
    ports:
      - "${PROVIDER_PORT:-9080}:8080"
    volumes:
      - provider-data:/data:rw
      - ${DIRECTORY_USERS_FILE:-./docker/provider/users.json}:/app/config/users.json:ro
    networks:
      - oidc-net
    depends_on:
      directory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  demo:
    build:
      context: ./src/demo
      dockerfile: Dockerfile
    container_name: oidc-demo
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      OPENID__AUTHORITY: http://provider:8080
      OPENID__PUBLICORIGIN: http://localhost:${PROVIDER_PORT:-9080}
      OPENID__CLIENTID: ${PROVIDER_CLIENT_ID:-test-client-id}
      OPENID__CLIENTSECRET: ${PROVIDER_CLIENT_SECRET:-local-dev-secret}
      OPENID__REQUIREHTTPSMETADATA: false
      OPENID__SCOPES__0: openid
      OPENID__SCOPES__1: profile
      OPENID__SCOPES__2: email
    depends_on:
      provider:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8080}:8080"
    networks:
      - oidc-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

networks:
  oidc-net:
    driver: bridge

volumes:
  provider-data:
    driver: local
  directory-data:
    driver: local
