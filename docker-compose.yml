services:
  # WARNING: default secret values below are DEVELOPMENT-ONLY and committed for local e2e convenience.
  # Never use them in production. Override via DIRECTORY_BEARER_TOKEN / PROVIDER_CLIENT_ID /
  # PROVIDER_CLIENT_SECRET environment variables (see CI workflow and production compose file).
  directory:
    build:
      context: ./src/directory
      dockerfile: Dockerfile
    container_name: oidc-directory
    restart: unless-stopped
    environment:
      PORT: 8080
      USERS_FILE: /app/config/users.json
      DATABASE_FILE: /data/directory.db
      BEARER_TOKEN: ${DIRECTORY_BEARER_TOKEN:-local-dev-bearer-token}
      SESSION_COOKIE_SECURE: false
    volumes:
      - ${DIRECTORY_USERS_FILE:-./docker/provider/users.json}:/app/config/users.json:ro
      - directory-data:/data:rw
    ports:
      - "${DIRECTORY_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  provider:
    build:
      context: ./src/provider
      dockerfile: Dockerfile
    container_name: oidc-provider
    restart: unless-stopped
    depends_on:
      directory:
        condition: service_healthy
    environment:
      PORT: 8080
      ISSUER: ${PROVIDER_ISSUER:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_ID: ${PROVIDER_CLIENT_ID:-local-dev}
      CLIENT_SECRET: ${PROVIDER_CLIENT_SECRET:-local-dev-secret}
      REDIRECT_URIS: ${PROVIDER_REDIRECT_URIS:-http://localhost:3000/callback,http://localhost:8080/callback}
      OIDC_PRESET: ${OIDC_PRESET:-local}
      DIRECTORY_TYPE: remote
      DIRECTORY_BASE_URL: http://directory:8080
      DIRECTORY_HEADERS: ${DIRECTORY_HEADERS:-{"Authorization":"Bearer local-dev-bearer-token"}}
      DATABASE_FILE: /data/oidc.db
    volumes:
      - provider-data:/data:rw
    ports:
      - "${PROVIDER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/.well-known/openid-configuration', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  demo:
    image: mcr.microsoft.com/dotnet/samples:aspnetapp
    container_name: oidc-demo
    profiles: ["demo"]
    depends_on:
      provider:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      OPENID__AUTHORITY: ${PROVIDER_ISSUER:-http://localhost:8080}
      OPENID__CLIENTID: ${PROVIDER_CLIENT_ID:-local-dev}
      OPENID__CLIENTSECRET: ${PROVIDER_CLIENT_SECRET:-local-dev-secret}
      OPENID__CALLBACKPATH: /signin-oidc
    ports:
      - "${DEMO_PORT:-3000}:80"

volumes:
  directory-data:
  provider-data:
