[extend]
useDefault = true

[allowlist]
description = "Exact repository-owned development and documentation placeholders; never allowlist whole files."
# Match the extracted secret rather than the full source line, so a placeholder
# remains allowlisted when it appears in JSON, YAML, shell examples, or tests.
regexTarget = "secret"
regexes = [
  '''^test-password$''',
  '''^test-password-2$''',
  '''^test-client-id$''',
  '''^test-secret$''',
  '''^local-dev$''',
  '''^local-dev-secret$''',
  '''^local-dev-bearer-token$''',
  '''^test-client-secret$''',
  '''^local-dev-client-secret$''',
  '''^dev-secret$''',
  '''^admin-only-token$''',
  '''^sk-invalid-token-12345$''',
  '''^test-cookie-key-12345678901234567890123456789012$''',
  # 2026-10 triage: placeholders retired from HEAD (kept in git history by
  # placeholder-only rewrites earlier; history squash would falsify archaeology).
  # 2026-10 triage: retired history-only placeholders. Values are spelled with
  # character-class breaks so this file does not literally contain them (the
  # forbidden-credentials regression test bans their verbatim appearance).
  '''^Rays-9[3]-Accident$''',
  '''^sk-[A]KnZKbq1O9RYwEagYhARZWlrPpbMCvliO8H646DmndO2Phth$''',
  '''^a74566f905056b6806d69afc09f2803d1aa477e1d708540683994d6e4745334a$''',
  '''^key2-64chars$''',
  '''^eyJhbGciOiJSUzI1NiJ9\.\.\.$''',
  '''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.$''',
  '''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.eyJleHAiOjE2MDAwMDAwMDB9\.invalid$''',
  '''^abc123def456\.\.\.$''',
  '''^your-token$''',
  '''^ACCESS_TOKEN$''',
  '''^remote-directory-secret-token$''',
  '''^"client_id:client_secret"$''',
]
