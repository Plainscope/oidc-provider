[extend]
useDefault = true

[allowlist]
description = "Exact repository-owned development and documentation placeholders; never allowlist whole files."
# Match the extracted secret rather than the full source line, so a placeholder
# remains allowlisted when it appears in JSON, YAML, shell examples, or tests.
regexTarget = "secret"
regexes = [
  '''^test-password$''',
  '''^test-password-2$''',
  '''^test-client-id$''',
  '''^test-secret$''',
  '''^local-dev$''',
  '''^local-dev-secret$''',
  '''^local-dev-bearer-token$''',
  '''^test-client-secret$''',
  '''^local-dev-client-secret$''',
  '''^dev-secret$''',
  '''^admin-only-token$''',
  '''^sk-invalid-token-12345$''',
  '''^test-cookie-key-12345678901234567890123456789012$''',
]
