name: "Directory Python Matrix"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/directory/**/*
      - .github/workflows/directory-python-matrix.yaml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - src/directory/**/*
      - .github/workflows/directory-python-matrix.yaml

permissions:
  contents: read

jobs:
  directory-python-matrix:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Directory Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: src/directory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/directory/requirements.txt

      - name: Install dependencies from requirements.txt
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Smoke import and version report
        run: |
          set -euo pipefail
          python - <<'EOF'
          import sys
          from importlib.metadata import version, PackageNotFoundError

          def pkg_version(name):
              try:
                  return version(name)
              except PackageNotFoundError:
                  return "not installed"

          import flask
          import dotenv
          import bcrypt
          import flask_wtf
          import flask_session
          import flask_limiter
          import gunicorn
          import sqlalchemy
          import psycopg
          import alembic
          import jwt

          print(f"Python: {sys.version}")
          print(f"Flask: {pkg_version('Flask')}")
          print(f"SQLAlchemy: {pkg_version('SQLAlchemy')}")
          print(f"PyJWT: {pkg_version('PyJWT')}")
          print("All required packages import successfully.")
          EOF

      - name: Run constraint regression tests
        run: |
          set -euo pipefail
          python test_constraints.py

      - name: Run dual-engine database tests (SQLite; Postgres if DATABASE_URL set)
        run: |
          set -euo pipefail
          python test_database_engines.py

      - name: Run secrets loader tests
        run: |
          set -euo pipefail
          python test_secrets_loader.py

      - name: Run service JWT auth tests
        run: |
          set -euo pipefail
          python test_service_auth.py

      - name: Run admin and mTLS auth tests
        run: |
          set -euo pipefail
          python test_admin_mtls_auth.py

      - name: Application factory smoke test
        run: |
          set -euo pipefail
          export SECRET_KEY=test-only-ci-key
          export FLASK_ENV=development
          export DATABASE_FILE="${RUNNER_TEMP:-/tmp}/directory-ci-users.db"
          mkdir -p "$(dirname "$DATABASE_FILE")"
          python - <<'EOF'
          import os
          assert os.environ.get("SECRET_KEY"), "SECRET_KEY required"
          assert os.environ.get("DATABASE_FILE"), "DATABASE_FILE required"
          from app import app
          client = app.test_client()
          rv = client.get("/healthz")
          assert rv.status_code == 200, f"unexpected health status: {rv.status_code} body={rv.data!r}"
          print(f"App test_client health probe: HTTP {rv.status_code}")
          print("Application factory smoke test passed.")
          EOF
