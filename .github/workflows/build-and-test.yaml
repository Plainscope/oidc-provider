name: "Build And Test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - .github/workflows/*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - .github/workflows/*

permissions:
  checks: write
  pull-requests: write
  contents: read
  # packages: write not needed for build-and-test job; push job uses its own permissions

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Build And Test"
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.16
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
        volumes:
          - /var/lib/docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build and run services
        run: |
          docker compose up -d --build
        env:
          DIRECTORY_BEARER_TOKEN: ${{ secrets.DIRECTORY_BEARER_TOKEN }}
          PROVIDER_CLIENT_ID: ${{ secrets.PROVIDER_CLIENT_ID }}
          PROVIDER_CLIENT_SECRET: ${{ secrets.PROVIDER_CLIENT_SECRET }}

      - name: Wait for services to be healthy
        run: |
          # Wait for services to be healthy
          docker compose exec -T provider sh -c '
            until curl -f http://localhost:8080/healthz; do
              echo "Waiting for provider service to be healthy..."
              sleep 5
            done
          '
          docker compose exec -T directory sh -c '
            until curl -f http://localhost:8080/healthz; do
              echo "Waiting for directory service to be healthy..."
              sleep 5
            done
          '

      - name: Install test dependencies
        run: npm install
        working-directory: ./test

      - name: Install Playwright system dependencies
        run: npx playwright install-deps
        working-directory: ./test

      - name: Install Playwright browsers
        run: npm run playwright:install
        working-directory: ./test

      - name: Run tests
        run: npm run test:e2e
        working-directory: ./test

      - name: Publish Playwright JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ./test/playwright-report/results.xml
          check_name: Playwright Tests

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ./test/playwright-report/html

      - name: Tear down services
        if: always()
        run: docker compose down -v

      - name: Generate logs on failure
        if: failure()
        run: |
          docker compose logs > build-and-test-logs.txt
        continue-on-error: true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: build-and-test-logs.txt

  security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Security Scan (Trivy + Gitleaks)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - name: Run Trivy filesystem scan (deps, secrets, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only until the baseline is triaged; remove to enforce.
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: '1'

      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Run Gitleaks secret scan (OSS)
        # Report-only until committed dev-only fixtures are triaged/allowlisted.
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif \
            --exit-code 1

      - name: Upload Gitleaks SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Build images for vulnerability scan
        run: |
          docker build -t scan-provider:ci -f src/provider/Dockerfile src/provider
          docker build -t scan-directory:ci -f src/directory/Dockerfile src/directory
          docker build -t scan-demo:ci -f src/demo/Dockerfile src/demo

      - name: Scan provider image
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only until the baseline is triaged; remove to enforce.
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-provider:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'

      - name: Scan directory image
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only until the baseline is triaged; remove to enforce.
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-directory:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'

      - name: Scan demo image
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only until the baseline is triaged; remove to enforce.
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-demo:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'

  push-docker-images:
    name: "Build and Push Docker Images"
    permissions:
      contents: read
      packages: write
    needs: build-and-test
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-push-${{ github.ref }}
      cancel-in-progress: false

    strategy:
      matrix:
        image:
          - name: provider
            context: ./src/provider
            dockerfile: ./src/provider/Dockerfile
          - name: directory
            context: ./src/directory
            dockerfile: ./src/directory/Dockerfile
          - name: demo
            context: ./src/demo
            dockerfile: ./src/demo/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' src/provider/package.json)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version extracted: v${VERSION}"
      
      - name: Prepare repository owner
        id: repo-owner
        run: |
          echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/simple-oidc-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
