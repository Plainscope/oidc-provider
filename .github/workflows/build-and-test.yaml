name: "Build And Test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*

permissions:
  checks: write
  pull-requests: write
  contents: read
  # packages: write not needed for build-and-test job; push job uses its own permissions

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Build And Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
