name: "Build And Test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*

permissions:
  checks: write
  pull-requests: write
  contents: read
  # packages: write not needed for build-and-test job; push job uses its own permissions

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Build And Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build and run services (with Buildx GHA cache)
        run: |
          # Prefer BuildKit/Buildx GHA cache over coarse /var/lib/docker caching.
          # Pre-build each service image with an explicit cache scope so security-scan
          # and push jobs can reuse layers, then start Compose without a second full
          # cold build.
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          docker buildx build \
            --cache-from type=gha,scope=e2e-provider \
            --cache-to type=gha,mode=max,scope=e2e-provider \
            --load \
            -t oidc-provider-provider \
            -f src/provider/Dockerfile src/provider
          docker buildx build \
            --cache-from type=gha,scope=e2e-directory \
            --cache-to type=gha,mode=max,scope=e2e-directory \
            --load \
            -t oidc-provider-directory \
            -f src/directory/Dockerfile src/directory
          docker buildx build \
            --cache-from type=gha,scope=e2e-demo \
            --cache-to type=gha,mode=max,scope=e2e-demo \
            --load \
            -t oidc-provider-demo \
            -f src/demo/Dockerfile src/demo
          # Compose project name defaults to directory name "oidc-provider",
          # so image tags above match compose's expected local images.
          docker compose up -d --no-build
        env:
          DIRECTORY_BEARER_TOKEN: ${{ secrets.DIRECTORY_BEARER_TOKEN }}
          PROVIDER_CLIENT_ID: ${{ secrets.PROVIDER_CLIENT_ID }}
          PROVIDER_CLIENT_SECRET: ${{ secrets.PROVIDER_CLIENT_SECRET }}

      - name: Wait for all services to be healthy
        run: |
          set -euo pipefail
          wait_for() {
            local service="$1"
            echo "Waiting for ${service} to be healthy..."
            for i in $(seq 1 36); do
              if docker compose exec -T "${service}" sh -c 'curl -fsS http://localhost:8080/healthz' >/dev/null 2>&1; then
                echo "${service} is healthy."
                return 0
              fi
              echo "  attempt ${i}/36: ${service} not ready yet..."
              sleep 5
            done
            echo "::error::${service} failed health check after 3 minutes"
            docker compose ps -a || true
            docker compose logs --no-color "${service}" || true
            return 1
          }
          wait_for directory
          wait_for provider
          wait_for demo
          echo "All Compose services report healthy."
          docker compose ps -a

      - name: Install test dependencies
        run: npm ci
        working-directory: ./test

      - name: Install Playwright system dependencies
        run: npx playwright install-deps
        working-directory: ./test

      - name: Install Playwright browsers
        run: |
          # On pull requests install Chromium only (fast path).
          # Full matrix (chromium, firefox, webkit, mobile) runs on main / workflow_dispatch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright install chromium
          else
            npm run playwright:install
          fi
        working-directory: ./test

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fast required PR suite: Chromium only.
            npx playwright test --project=chromium
          else
            npm run test:e2e
          fi
        working-directory: ./test
        env:
          CI: true
          # Keep in sync with Compose so fixtures use the same client credentials.
          PROVIDER_CLIENT_ID: ${{ secrets.PROVIDER_CLIENT_ID }}
          PROVIDER_CLIENT_SECRET: ${{ secrets.PROVIDER_CLIENT_SECRET }}

      - name: Publish Playwright JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ./test/playwright-report/results.xml
          check_name: Playwright Tests

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ./test/playwright-report/html
          if-no-files-found: ignore

      # Diagnostics MUST run before teardown so containers still exist.
      - name: Collect service diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/compose-ps.txt 2>&1
          docker compose logs --no-color > diagnostics/compose-all.log 2>&1
          docker compose logs --no-color provider > diagnostics/provider.log 2>&1
          docker compose logs --no-color directory > diagnostics/directory.log 2>&1
          docker compose logs --no-color demo > diagnostics/demo.log 2>&1
          docker inspect oidc-provider > diagnostics/provider-inspect.json 2>&1
          docker inspect oidc-directory > diagnostics/directory-inspect.json 2>&1
          docker inspect oidc-demo > diagnostics/demo-inspect.json 2>&1
          # Host-side probe of the demo port used by Playwright
          curl -v --max-time 5 http://localhost:8080/healthz > diagnostics/host-demo-healthz.txt 2>&1 || true
          curl -v --max-time 5 http://localhost:9080/healthz > diagnostics/host-provider-healthz.txt 2>&1 || true
          ls -la diagnostics/
        continue-on-error: true

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: docker compose down -v

  security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Security Scan (Trivy + Gitleaks)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Trivy filesystem scan (deps, secrets, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        # Report-only until the baseline is triaged; remove to enforce.
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Run Gitleaks secret scan (OSS)
        # Report-only until committed dev-only fixtures are triaged/allowlisted.
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo --redact --verbose \
            --report-format sarif --report-path /repo/gitleaks.sarif \
            --exit-code 1

      - name: Upload Gitleaks SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # Reuse Buildx GHA cache from build-and-test scopes to avoid cold full rebuilds.
      - name: Build images for vulnerability scan (Buildx cache)
        run: |
          docker buildx build \
            --cache-from type=gha,scope=e2e-provider \
            --load \
            -t scan-provider:ci \
            -f src/provider/Dockerfile src/provider
          docker buildx build \
            --cache-from type=gha,scope=e2e-directory \
            --load \
            -t scan-directory:ci \
            -f src/directory/Dockerfile src/directory
          docker buildx build \
            --cache-from type=gha,scope=e2e-demo \
            --load \
            -t scan-demo:ci \
            -f src/demo/Dockerfile src/demo

      - name: Scan provider image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-provider:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Scan directory image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-directory:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Scan demo image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: scan-demo:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  push-docker-images:
    name: "Build and Push Docker Images"
    permissions:
      contents: read
      packages: write
    needs: build-and-test
    # Explicitly restrict publishing to pushes on main (not PRs or other branches).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-push-${{ github.ref }}
      cancel-in-progress: false

    strategy:
      matrix:
        image:
          - name: provider
            context: ./src/provider
            dockerfile: ./src/provider/Dockerfile
          - name: directory
            context: ./src/directory
            dockerfile: ./src/directory/Dockerfile
          - name: demo
            context: ./src/demo
            dockerfile: ./src/demo/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' src/provider/package.json)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version extracted: v${VERSION}"

      - name: Prepare repository owner
        id: repo-owner
        run: |
          echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/simple-oidc-${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ steps.package-version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=e2e-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.image.name }}
          platforms: linux/amd64,linux/arm64
