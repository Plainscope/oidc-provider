name: "Build And Test"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - src/**/*
      - test/**/*
      - docker-compose.yml
      - .github/workflows/*

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: "Build And Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Forbidden credential regression scan
        # Issue #37: fail fast if retired secret-scanning values reappear.
        run: node --test test/unit/forbidden-credentials.test.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Build and run services (with Buildx GHA cache)
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          docker buildx build \
            --cache-from type=gha,scope=e2e-provider \
            --cache-to type=gha,mode=max,scope=e2e-provider \
            --load \
            -t oidc-provider-provider \
            -f src/provider/Dockerfile src/provider
          docker buildx build \
            --cache-from type=gha,scope=e2e-directory \
            --cache-to type=gha,mode=max,scope=e2e-directory \
            --load \
            -t oidc-provider-directory \
            -f src/directory/Dockerfile src/directory
          docker buildx build \
            --cache-from type=gha,scope=e2e-demo \
            --cache-to type=gha,mode=max,scope=e2e-demo \
            --load \
            -t oidc-provider-demo \
            -f src/demo/Dockerfile src/demo
          docker compose up -d

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          wait_for() {
            local service="$1"
            echo "Waiting for ${service} to be healthy..."
            for i in $(seq 1 36); do
              if docker compose exec -T "${service}" sh -c 'curl -fsS http://localhost:8080/healthz' >/dev/null 2>&1; then
                echo "${service} is healthy."
                return 0
              fi
              echo "  attempt ${i}/36: ${service} not ready yet..."
              sleep 5
            done
            echo "::error::${service} failed health check after 3 minutes"
            docker compose ps -a || true
            docker compose logs --no-color "${service}" || true
            return 1
          }
          wait_for directory
          wait_for provider
          wait_for demo
          echo "All Compose services report healthy."
          docker compose ps -a

      - name: Install test dependencies
        run: npm ci
        working-directory: ./test

      - name: Install Playwright system dependencies
        run: npx playwright install-deps
        working-directory: ./test

      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright install chromium
          else
            npm run playwright:install
          fi
        working-directory: ./test

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=chromium
          else
            npm run test:e2e
          fi
        working-directory: ./test
        env:
          CI: true
          DIRECTORY_BEARER_TOKEN: ${{ secrets.DIRECTORY_BEARER_TOKEN }}
          PROVIDER_CLIENT_ID: ${{ secrets.PROVIDER_CLIENT_ID }}
          PROVIDER_CLIENT_SECRET: ${{ secrets.PROVIDER_CLIENT_SECRET }}

      - name: Publish Playwright JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ./test/playwright-report/results.xml
          check_name: Playwright Tests

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ./test/playwright-report/html
          if-no-files-found: ignore

      - name: Collect service diagnostics on failure
        if: failure()
        run: |
          set +e
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/compose-ps.txt 2>&1
          docker compose logs --no-color > diagnostics/compose-all.log 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Tear down services
        if: always()
        run: docker compose down -v
